<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Việt phục — chuyển động vải</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    [hidden]{display:none!important}
    #garment{position:relative;width:100%;height:100%;overflow:hidden}
    #garment-image{position:absolute;display:block;max-width:none;pointer-events:none}
    #cloth-canvas{position:absolute;inset:0;width:100%;height:100%}
    #image-error{position:absolute;inset:auto 0 10px;text-align:center;font:12px sans-serif;color:#11383a}
  </style>
  <script src="./garment-motion-profiles.js" defer></script>
  <script src="./garment-motion.js" defer></script>
</head>
<body>
  <div id="garment"><img id="garment-image" alt="Trang phục" draggable="false"><canvas id="cloth-canvas" hidden></canvas></div>
  <p id="image-error" role="status" hidden>Không tải được ảnh trang phục.</p>
</body>
</html>
